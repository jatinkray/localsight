# Minimal Prometheus scrape config for LocalVision.
# Metrics are exposed by the API at /api/system/metrics in Prometheus text format.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: localvision-api
    metrics_path: /api/system/metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: localvision-worker
    # The worker can expose metrics on its own port in production; for now it
    # shares the API's endpoint.
    metrics_path: /api/system/metrics
    static_configs:
      - targets: ["api:8000"]
