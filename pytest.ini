# Pytest configuration — LocalVision
#
# The `ui` marker separates the Playwright end-to-end suite (tests/ui — a
# real uvicorn server + a real browser) from the fast unit/API suite:
#
#   pytest tests/                    → unit + API tests only (default run)
#   pytest tests/ -m "not ui"        → same, explicit (what CI's unit job runs)
#   pytest tests/ui -m ui            → the browser suite (CI's ui-e2e job)
#
# tests/ui/* modules all carry `pytestmark = pytest.mark.ui`; without this
# marker registered, pytest would refuse to run at all — so the separation
# can never silently break by deleting a config line somewhere else.
[pytest]
testpaths = tests
markers =
    ui: real-browser end-to-end tests (tests/ui — needs Playwright + ffmpeg; run with `pytest tests/ui -m ui`)
addopts = -m "not ui"
